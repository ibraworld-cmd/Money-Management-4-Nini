<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Tracker</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    padding:15px;
}

.container{
    max-width:500px;
    margin:auto;
}
  
.card{
    background:#222;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

h1{
    text-align:center;
}

.balance{
    font-size:28px;
    color:#4caf50;
    text-align:center;
}

.stat{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    background:#2e7d32;
    color:white;
}

.reset{
    background:#c62828;
}

.item{
    background:#333;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.income{
    color:#4caf50;
}

.expense{
    color:#f44336;
}

.small{
    font-size:12px;
    color:#aaa;
}

.delete{
    background:#b71c1c;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<h1>💰 Money Tracker</h1>


<div class="card">

<h3>Saldo</h3>

<div class="balance" id="saldo">
Rp0
</div>


<div class="stat">
<span>Total Income</span>
<span id="totalIncome">Rp0</span>
</div>


<div class="stat">
<span>Total Pengeluaran</span>
<span id="totalExpense">Rp0</span>
</div>

</div>



<div class="card">

<h3>Tambah Income</h3>

<input id="incomeAmount" type="number" placeholder="Nominal income">

<button onclick="addIncome()">
Tambah Income
</button>

</div>



<div class="card">

<h3>Tambah Pengeluaran</h3>

<select id="category">

<option>Makan</option>
<option>Bensin</option>
<option>Belanja</option>
<option>Kuota</option>
<option>Hiburan</option>
<option>Kesehatan</option>
<option>Pendidikan</option>
<option>Lain-lain</option>

</select>


<input id="expenseAmount" type="number" placeholder="Nominal pengeluaran">


<input id="note" placeholder="Catatan">


<button onclick="addExpense()">
Tambah Pengeluaran
</button>


</div>



<div class="card">

<h3>Riwayat</h3>

<div id="history"></div>

</div>



<div class="card">

<button class="reset" onclick="resetData()">
RESET SEMUA DATA
</button>

</div>


</div>



<script>

let data = JSON.parse(localStorage.getItem("moneyData")) || [];


function rupiah(n){

return "Rp " + n.toLocaleString("id-ID");

}



function save(){

localStorage.setItem(
"moneyData",
JSON.stringify(data)
);

render();

}



function addIncome(){

let amount =
Number(document.getElementById("incomeAmount").value);


if(amount <= 0){

alert("Masukkan nominal income");

return;

}


data.unshift({

type:"income",
amount:amount,
category:"Income",
note:"Pemasukan",
date:new Date().toLocaleDateString()

});


document.getElementById("incomeAmount").value="";


save();

}




function addExpense(){

let amount =
Number(document.getElementById("expenseAmount").value);


let category =
document.getElementById("category").value;


let note =
document.getElementById("note").value;



if(amount <= 0){

alert("Masukkan nominal pengeluaran");

return;

}



let saldo = getSaldo();


if(amount > saldo){

alert("Saldo tidak cukup");

return;

}



data.unshift({

type:"expense",
amount:amount,
category:category,
note:note,
date:new Date().toLocaleDateString()

});


document.getElementById("expenseAmount").value="";
document.getElementById("note").value="";


save();

}




function getSaldo(){

let total=0;


data.forEach(item=>{


if(item.type=="income"){

total += item.amount;

}

else{

total -= item.amount;

}


});


return total;

}




function render(){


let saldo=0;
let income=0;
let expense=0;


let box=document.getElementById("history");


box.innerHTML="";



data.forEach((item,index)=>{


if(item.type=="income"){

saldo+=item.amount;
income+=item.amount;

}

else{

saldo-=item.amount;
expense+=item.amount;

}



box.innerHTML += `

<div class="item">

<b>${item.category}</b>

<br>

${item.note}

<br>

<span class="small">
${item.date}
</span>

<br>


<span class="${item.type}">

${item.type=="income" ? "+" : "-"}
${rupiah(item.amount)}

</span>


<button class="delete" onclick="hapus(${index})">
Hapus
</button>


</div>

`;

});



document.getElementById("saldo").innerHTML =
rupiah(saldo);


document.getElementById("totalIncome").innerHTML =
rupiah(income);


document.getElementById("totalExpense").innerHTML =
rupiah(expense);


}




function hapus(index){

if(confirm("Hapus transaksi ini?")){

data.splice(index,1);

save();

}

}




function resetData(){

if(confirm("Hapus semua data?")){


data=[];

localStorage.removeItem("moneyData");

render();


}

}




render();


</script>


</body>
</html>
